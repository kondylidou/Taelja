name: CI

on:
  push:
    branches: [main, theta-strict-mode]
  pull_request:

jobs:
  goldens:
    # macOS arm64: the committed bin/twee is a Mach-O arm64 binary
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Set up GHC
        uses: haskell-actions/setup@v2
        with:
          ghc-version: '9.6.7'
          cabal-version: 'latest'

      - name: Cache cabal store
        uses: actions/cache@v4
        with:
          path: |
            ~/.cabal/store
            dist-newstyle
          key: cabal-${{ runner.os }}-ghc967-${{ hashFiles('taelja.cabal') }}
          restore-keys: cabal-${{ runner.os }}-ghc967-

      - name: Install E prover
        run: brew install eprover

      - name: Build
        run: cabal build --enable-tests all

      - name: Golden suite
        run: cabal test --test-show-details=direct

# A Lean job is not feasible here: lean/TaeljaVerify.lean imports the
# generated evaluation modules, which are local artifacts and not tracked.
# Suite proof modules are verified locally (lake env lean per module).
