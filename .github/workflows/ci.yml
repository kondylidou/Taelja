name: CI

on:
  push:
    branches: [main, theta-strict-mode]
  pull_request:

jobs:
  goldens:
    # macOS arm64: the committed bin/twee is a Mach-O arm64 binary
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Set up GHC
        uses: haskell-actions/setup@v2
        with:
          ghc-version: '9.6.7'
          cabal-version: 'latest'

      - name: Cache cabal store
        uses: actions/cache@v4
        with:
          path: |
            ~/.cabal/store
            dist-newstyle
          key: cabal-${{ runner.os }}-ghc967-${{ hashFiles('taelja.cabal') }}
          restore-keys: cabal-${{ runner.os }}-ghc967-

      - name: Install E prover
        run: brew install eprover

      - name: Build
        run: cabal build --enable-tests all

      - name: Golden suite
        run: cabal test --test-show-details=direct

  lean:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Install elan (Lean toolchain manager)
        run: |
          curl -sSf https://elan.lean-lang.org/elan-init.sh | sh -s -- -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"

      - name: Cache Lean build
        uses: actions/cache@v4
        with:
          path: lean/.lake
          key: lake-${{ runner.os }}-${{ hashFiles('lean/lean-toolchain', 'lean/lakefile.toml') }}

      - name: Verify suite proof modules
        working-directory: lean
        run: lake build
